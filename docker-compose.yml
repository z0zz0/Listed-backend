services:
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: listed
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      postgresql:
        condition: service_healthy

  seq:
    image: datalust/seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: true
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "listed_valkey_local_password"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "listed_valkey_local_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  listed.api.1:
    build:
      context: .
      dockerfile: src/Listed.API/Dockerfiles/Dockerfile_local
    stdin_open: true
    tty: true
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgresql:
        condition: service_healthy
      seq:
        condition: service_started
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./src/Listed.API:/app/Listed.API
      - ./src/Listed.Domain:/app/Listed.Domain
      - ./src/Listed.Application:/app/Listed.Application
      - ./src/Listed.Infrastructure:/app/Listed.Infrastructure
      - api1_listed_api_bin:/app/Listed.API/bin
      - api1_listed_api_obj:/app/Listed.API/obj
      - api1_listed_domain_bin:/app/Listed.Domain/bin
      - api1_listed_domain_obj:/app/Listed.Domain/obj
      - api1_listed_application_bin:/app/Listed.Application/bin
      - api1_listed_application_obj:/app/Listed.Application/obj
      - api1_listed_infrastructure_bin:/app/Listed.Infrastructure/bin
      - api1_listed_infrastructure_obj:/app/Listed.Infrastructure/obj

  listed.api.2:
    build:
      context: .
      dockerfile: src/Listed.API/Dockerfiles/Dockerfile_local
    stdin_open: true
    tty: true
    expose:
      - "5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      postgresql:
        condition: service_healthy
      seq:
        condition: service_started
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./src/Listed.API:/app/Listed.API
      - ./src/Listed.Domain:/app/Listed.Domain
      - ./src/Listed.Application:/app/Listed.Application
      - ./src/Listed.Infrastructure:/app/Listed.Infrastructure
      - api2_listed_api_bin:/app/Listed.API/bin
      - api2_listed_api_obj:/app/Listed.API/obj
      - api2_listed_domain_bin:/app/Listed.Domain/bin
      - api2_listed_domain_obj:/app/Listed.Domain/obj
      - api2_listed_application_bin:/app/Listed.Application/bin
      - api2_listed_application_obj:/app/Listed.Application/obj
      - api2_listed_infrastructure_bin:/app/Listed.Infrastructure/bin
      - api2_listed_infrastructure_obj:/app/Listed.Infrastructure/obj

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "5000:80"
    depends_on:
      listed.api.1:
        condition: service_started
      listed.api.2:
        condition: service_started
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      
volumes:
  postgresql_data:
    driver: local
  seq_data:
    driver: local
  valkey_data:
    driver: local
  api1_listed_api_bin:
    driver: local
  api1_listed_api_obj:
    driver: local
  api1_listed_domain_bin:
    driver: local
  api1_listed_domain_obj:
    driver: local
  api1_listed_application_bin:
    driver: local
  api1_listed_application_obj:
    driver: local
  api1_listed_infrastructure_bin:
    driver: local
  api1_listed_infrastructure_obj:
    driver: local
  api2_listed_api_bin:
    driver: local
  api2_listed_api_obj:
    driver: local
  api2_listed_domain_bin:
    driver: local
  api2_listed_domain_obj:
    driver: local
  api2_listed_application_bin:
    driver: local
  api2_listed_application_obj:
    driver: local
  api2_listed_infrastructure_bin:
    driver: local
  api2_listed_infrastructure_obj:
    driver: local
